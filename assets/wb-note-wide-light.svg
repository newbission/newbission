<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190"><rect x="1" y="1" width="1098" height="188" rx="8" fill="#E7E9DF" stroke="#D4D8C9"/><text x="32" y="39" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2" fill="#697262">A NOTE TO SELF</text><text x="32" y="92" font-family="Arial,Helvetica,Apple SD Gothic Neo,sans-serif" font-size="29" fill="#222620">처음 해보는 일도, <tspan fill="#48681F">끝까지</tspan> 해보는 쪽으로.</text><text x="32" y="139" font-family="Arial,Helvetica,Apple SD Gothic Neo,sans-serif" font-size="15" fill="#697262">신인의 자세는 잃지 않고, 만드는 사람으로 계속 나아가기.</text></svg>