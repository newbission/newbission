<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250"><rect x="1" y="1" width="498" height="248" rx="8" fill="#20261F" stroke="#343B32"/><text x="28" y="36" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2" fill="#949D90">A NOTE TO SELF</text><text x="28" y="97" font-family="Arial,Helvetica,Apple SD Gothic Neo,sans-serif" font-size="28" fill="#EFEDE4">처음 해보는 일도,</text><text x="28" y="138" font-family="Arial,Helvetica,Apple SD Gothic Neo,sans-serif" font-size="28" fill="#EFEDE4"><tspan fill="#D1EF80">끝까지</tspan> 해보는 쪽으로.</text><text x="28" y="186" font-family="Arial,Helvetica,Apple SD Gothic Neo,sans-serif" font-size="14" fill="#949D90">신인의 자세는 잃지 않고,</text><text x="28" y="210" font-family="Arial,Helvetica,Apple SD Gothic Neo,sans-serif" font-size="14" fill="#949D90">만드는 사람으로 계속 나아가기.</text></svg>